<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ValidResult Evaluation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <link data-trunk rel="rust" data-wasm-opt="z" />
    <link data-trunk rel="tailwind-css" href="styles/input.css" />
    <link data-trunk rel="tailwind-css" href="styles/chart.css" />
</head>
<body class="font-sans h-screen flex overflow-hidden" style="background:#131627; color:#c8d8f0;">

<aside style="width:256px; background:#0f1219; border-right:3px solid #11326c; flex-shrink:0;" class="flex flex-col md:flex">
    <div>
        <div style="height:64px; display:flex; align-items:center; padding:0 24px; border-bottom:3px solid #1e3a6e;">
            <span style="font-size:18px; font-weight:700; color:#e2e8f0; font-family:'JetBrains Mono',monospace;">
                <span style="color:#4a9eff;">ValidResult</span>
            </span>
        </div>
        <div id="nav-mount" class="flex-1 space-y-4"></div>
    </div>
</aside>

<main class="flex-1 flex flex-col h-full overflow-hidden">

    <header style="height:64px; background:#0f1219; border-bottom:3px solid #1e3a6e; display:flex; align-items:center; justify-content:space-between; padding:0 24px; flex-shrink:0;">
        <h1 style="font-size:15px; font-weight:600; color:#e2e8f0; font-family:'JetBrains Mono',monospace;">Интегральная оценка (MVP)</h1>
        <div style="display:flex; gap:12px; align-items:center; flex-shrink:0;">
            <div id="add-mount" style="width: 180px; height: 40px;"></div>
            <div id="list-mount" style="width: 180px; height: 40px;"></div>
        </div>
    </header>

    <div id="app-mount" class="flex-1 overflow-auto space-y-4" style="padding:16px;"></div>
</main>

</body>
</html>
